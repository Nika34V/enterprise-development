name: Build and Test

on:
  push:
    branches: [ main, lab1 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore FitnessClub.slnx

      - name: Build solution
        run: dotnet build FitnessClub.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test FitnessClub.slnx --configuration Release --no-build --logger "console;verbosity=detailed"